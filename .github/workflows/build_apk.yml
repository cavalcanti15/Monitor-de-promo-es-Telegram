name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install dependencies and Build APK
        run: |
          pip install -r requirements.txt
          flet build apk --project "MonitorPromocoes" --org "com.arthur.monitor"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MonitorPromocoes-APK
          path: build/apk/app-release.apk
