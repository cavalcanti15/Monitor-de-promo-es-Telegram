name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev clang cmake ninja-build pkg-config liblzma-dev

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: "stable"

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      # --- NOVO PASSO: instalar as bibliotecas Python necessárias ---
      - name: Install Python dependencies
        run: |
          pip install plyer firebase-admin

      - name: Gerar wheel do pyaes (só tem sdist no PyPI)
        run: |
          pip install wheel setuptools
          mkdir -p wheels
          pip wheel pyaes -w wheels
          ls wheels

      - name: Diagnóstico (mostra quem conflita sem o wheel)
        run: |
          printf "flet==0.25.2\ntelethon\n" > /tmp/req.txt
          pip install --dry-run --only-binary=:all: -r /tmp/req.txt || true

      - name: Build APK
        env:
          PIP_FIND_LINKS: ${{ github.workspace }}/wheels
        run: |
          find . -maxdepth 3 -name "main.py" -exec cp {} ./main.py \; 2>/dev/null || true
          pip install flet==0.25.2
          printf "flet==0.25.2\ntelethon\n" > requirements.txt
          flet build apk --project "MonitorPromocoes" --org "com.usuario.monitorpromocoes" --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MonitorPromocoes-APK
          path: build/apk/app-release.apk
