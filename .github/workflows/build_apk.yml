name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.3"
          channel: "stable"

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Build APK
        run: |
          pip install flet==0.24.1
          printf "telethon==1.37.0\n" > requirements.txt
          flet build apk --project "MonitorPromocoes" --org "com.arthur.monitor" --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MonitorPromocoes-APK
          path: build/apk/app-release.apk
